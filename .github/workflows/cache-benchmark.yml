name: Cache Benchmark

# GitHub Actions のキャッシュをフル活用した場合／しない場合で、
# Web アプリの CI（依存インストール・lint・型チェック・unit・build・E2E・Docker ビルド・Trivy スキャン）の
# 実行時間を比較する。結果は HTML レポートとして Actions Artifact に保存する。
#
# app:
#   small  依存約 180 個の小さなアプリ
#   large  依存約 480 個（MUI など）＋生成した 300 機能のアプリ
# variant:
#   none        キャッシュなし（setup-node の自動キャッシュも明示的に無効化）
#   setup-node  定番の最小構成（setup-node の cache: npm で ~/.npm だけ）
#   full        node_modules・~/.npm・Playwright ブラウザ・BuildKit（gha）・Trivy DB をキャッシュ
#
# reset → prime（cold・キャッシュ作成）→ measure（warm）→ report → cleanup の順に実行する。
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "各 app × variant の warm 計測回数"
        type: choice
        options: ["1", "3", "5"]
        default: "3"

permissions:
  contents: read

concurrency:
  group: cache-benchmark
  cancel-in-progress: false

env:
  CACHE_PREFIX: bench-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # run をまたいで共有されるキー（trivy-action・setup-trivy・BuildKit の blob）を消して cold から始める
  reset:
    name: reset shared caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete shared caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh cache list --repo "$REPO" --limit 1000 --json id,key \
            --jq '.[] | select(.key | test("^(cache-trivy-|trivy-binary-|buildkit-|index-)")) | "\(.id)"' > ids.txt
          while read -r id; do gh cache delete "$id" --repo "$REPO"; done < ids.txt
          echo "deleted $(wc -l < ids.txt) shared caches"

  prime:
    name: prime / ${{ matrix.app }} / ${{ matrix.variant }}
    needs: reset
    strategy:
      fail-fast: false
      matrix:
        app: [small, large]
        variant: [setup-node, full]
    uses: ./.github/workflows/cache-benchmark-run.yml
    with:
      app: ${{ matrix.app }}
      variant: ${{ matrix.variant }}
      phase: cold
      iteration: 0
      cache-prefix: bench-${{ github.run_id }}-${{ github.run_attempt }}

  measure:
    name: measure / ${{ matrix.app }} / ${{ matrix.variant }} / ${{ matrix.iteration }}
    needs: prime
    strategy:
      fail-fast: false
      matrix:
        app: [small, large]
        variant: [none, setup-node, full]
        iteration: ${{ fromJSON(inputs.iterations == '5' && '[1,2,3,4,5]' || inputs.iterations == '1' && '[1]' || '[1,2,3]') }}
    uses: ./.github/workflows/cache-benchmark-run.yml
    with:
      app: ${{ matrix.app }}
      variant: ${{ matrix.variant }}
      phase: warm
      iteration: ${{ matrix.iteration }}
      cache-prefix: bench-${{ github.run_id }}-${{ github.run_attempt }}

  report:
    name: report
    needs: [prime, measure]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/bench

      - name: Download per-job metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-meta-*
          path: meta
          merge-multiple: true

      - name: Fetch job and step timings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | {name, status, conclusion, started_at, completed_at, html_url, steps: [.steps[] | {name, conclusion, started_at, completed_at}]}' \
            > jobs.jsonl
          wc -l jobs.jsonl

      - name: Build HTML report
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          set -euo pipefail
          mkdir -p out
          python3 scripts/bench/make_report.py --jobs jobs.jsonl --meta meta --out out/cache-benchmark-report.html --summary out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: out/cache-benchmark-report.html
          archive: false
          retention-days: 90
          if-no-files-found: error

      - name: Link to report
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: echo "HTML レポート - ${ARTIFACT_URL}" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: cleanup caches
    needs: [report]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete caches created by this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREFIX: ${{ env.CACHE_PREFIX }}-
        run: |
          set -euo pipefail
          # 一覧を残しておくと、BuildKit などのキー形式を後から確認できる
          gh cache list --repo "$REPO" --limit 1000 --json key,sizeInBytes \
            --jq '.[] | "\(.sizeInBytes)\t\(.key)"' | cut -c1-120 | sort -k2 | head -50
          # shellcheck disable=SC2016 # $ENV は jq の式
          gh cache list --repo "$REPO" --limit 1000 --json id,key \
            --jq '.[] | select((.key | startswith($ENV.PREFIX)) or (.key | test("^(cache-trivy-|trivy-binary-|buildkit-|index-)"))) | "\(.id)"' > ids.txt
          while read -r id; do gh cache delete "$id" --repo "$REPO"; done < ids.txt
          echo "deleted $(wc -l < ids.txt) caches"
