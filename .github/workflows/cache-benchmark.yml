name: Cache Benchmark

# GitHub Actions のキャッシュをフル活用した場合／しない場合で、
# Web アプリのテスト（lint・型チェック・unit・build・E2E）の実行時間を比較する。
# 結果は HTML レポートとして Actions Artifact に保存する。
#
# variant:
#   none        キャッシュなし（setup-node の自動キャッシュも明示的に無効化）
#   setup-node  定番の最小構成（setup-node の cache: npm で ~/.npm だけ）
#   full        ~/.npm・node_modules・Playwright ブラウザ・ESLint/tsc/Vitest のキャッシュ
#
# 公平性のため full のキャッシュキーには run_id を含め、run ごとに作り直す。
# prime job が cold 状態で 1 回走ってキャッシュを作り、その後 measure job が warm 状態で計測する。
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "各 variant の warm 計測回数"
        type: choice
        options: ["1", "3", "5"]
        default: "3"

permissions:
  contents: read

concurrency:
  group: cache-benchmark
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  APP_DIR: bench/web-app
  CACHE_PREFIX: bench-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  prime:
    name: prime / ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [setup-node, full]
    uses: ./.github/workflows/cache-benchmark-run.yml
    with:
      variant: ${{ matrix.variant }}
      phase: cold
      iteration: 0
      cache-prefix: bench-${{ github.run_id }}-${{ github.run_attempt }}

  measure:
    name: measure / ${{ matrix.variant }} / ${{ matrix.iteration }}
    needs: prime
    strategy:
      fail-fast: false
      matrix:
        variant: [none, setup-node, full]
        iteration: ${{ fromJSON(inputs.iterations == '5' && '[1,2,3,4,5]' || inputs.iterations == '1' && '[1]' || '[1,2,3]') }}
    uses: ./.github/workflows/cache-benchmark-run.yml
    with:
      variant: ${{ matrix.variant }}
      phase: warm
      iteration: ${{ matrix.iteration }}
      cache-prefix: bench-${{ github.run_id }}-${{ github.run_attempt }}

  report:
    name: report
    needs: [prime, measure]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/bench

      - name: Download per-job metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-meta-*
          path: meta
          merge-multiple: true

      - name: Fetch job and step timings
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | {name, status, conclusion, started_at, completed_at, html_url, steps: [.steps[] | {name, conclusion, started_at, completed_at}]}' \
            > jobs.jsonl
          wc -l jobs.jsonl

      - name: Build HTML report
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          set -euo pipefail
          mkdir -p out
          python3 scripts/bench/make_report.py --jobs jobs.jsonl --meta meta --out out/cache-benchmark-report.html --summary out/summary.md
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: out/cache-benchmark-report.html
          archive: false
          retention-days: 90
          if-no-files-found: error

      - name: Link to report
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: echo "HTML レポート - ${ARTIFACT_URL}" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: cleanup caches
    needs: [report]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete caches created by this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PREFIX: ${{ env.CACHE_PREFIX }}-
        run: |
          set -euo pipefail
          ids=$(gh cache list --repo "$REPO" --key "$PREFIX" --limit 100 --json id --jq '.[].id')
          for id in $ids; do
            gh cache delete "$id" --repo "$REPO"
          done
          echo "deleted: $(echo "$ids" | grep -c . || true) caches with prefix ${PREFIX}"
